name: fairy-tale-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  solidity:
    name: solidity (parity / residency / install-smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unified CLI self-controls
        run: ./fairy selftest
      - name: Unified deterministic validation suite
        run: ./fairy validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

  adapters:
    name: adapters (manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unified CLI doctor (residency + adapter manifests)
        # Python and Rust stable are pre-installed on ubuntu-latest runners.
        run: ./fairy doctor

  task-artifact-python-compatibility:
    name: task artifacts (Python 3.13 compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install JSON Schema contract-test dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.26.0
      - name: E3 Draft 2020-12 schema contract
        run: python3 .github/scripts/e3_schema_contract.py
      - name: Helix blocker Draft 2020-12 schema contract
        run: python3 .github/scripts/helix_blocker_schema_contract.py
      - name: Implementation contract closure schema contract
        run: python3 .github/scripts/contract_closure_schema_contract.py
      - name: Contract closure CLI bound to the merge base
        run: |
          git fetch --no-tags --depth=50 origin main
          BASE=$(git merge-base FETCH_HEAD HEAD)
          echo "trusted base: $BASE"
          set +e
          OUTPUT=$(python3 scripts/implementation_contract_closure.py validate \
            --record examples/implementation-contract-closure.json \
            --inventory examples/implementation-contract-closure.inventory.txt \
            --trusted-base "$BASE" 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            # The only admissible failure is the increment that INTRODUCES the
            # authority files: they cannot exist at a base that predates them.
            REMAINING=$(echo "$OUTPUT" | grep '^\[RED' | grep -v 'authority-note:' || true)
            if [ -n "$REMAINING" ]; then
              echo "contract closure CLI failed with non-bootstrap findings"
              exit 1
            fi
            echo "only the authority-introduction note remains; accepted for this increment"
          fi
      - name: Release package ships every consumer
        run: python3 scripts/package_skills.py
      - name: Task artifact gate (self-controls)
        run: python3 scripts/task_artifacts.py selftest
      - name: Task artifact acceptance cases
        run: python3 scripts/task_artifacts.py cases --cases fixtures/task-artifacts/cases.jsonl
