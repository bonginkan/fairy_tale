name: fairy-tale-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  solidity:
    name: solidity (parity / residency / install-smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unified CLI self-controls
        run: ./fairy selftest
      - name: Unified deterministic validation suite
        run: ./fairy validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

  adapters:
    name: adapters (manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unified CLI doctor (residency + adapter manifests)
        # Python and Rust stable are pre-installed on ubuntu-latest runners.
        run: ./fairy doctor

  task-artifact-python-compatibility:
    name: task artifacts (Python 3.13 compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install JSON Schema contract-test dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.26.0
      - name: E3 Draft 2020-12 schema contract
        run: python3 .github/scripts/e3_schema_contract.py
      - name: Helix blocker Draft 2020-12 schema contract
        run: python3 .github/scripts/helix_blocker_schema_contract.py
      - name: Implementation contract closure schema contract
        run: python3 .github/scripts/contract_closure_schema_contract.py
      - name: Contract closure CLI bound to the merge base
        run: |
          git fetch --no-tags --unshallow origin main 2>/dev/null || \
            git fetch --no-tags --deepen=200 origin main || \
            git fetch --no-tags origin main
          git update-ref refs/remotes/origin/main FETCH_HEAD
          if ! BASE=$(git merge-base origin/main HEAD); then
            echo "cannot resolve a merge base — provenance cannot be proven, failing closed"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$BASE" = "$HEAD_SHA" ]; then
            # This run IS the integration history, so there is no base for it
            # to be measured against — and the gate rightly refuses a revision
            # that would vouch for itself. Skipping is stated, never silent,
            # and only where HEAD is genuinely contained in origin/main; the
            # provenance behaviour itself is covered by the runtime
            # self-controls and the separate-project package E2E below.
            if git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
              echo "HEAD ($HEAD_SHA) is the integration branch: no earlier base exists to measure against, so this PR-shaped control does not apply here"
              exit 0
            fi
            echo "the merge base equals HEAD but HEAD is not contained in origin/main — failing closed"
            exit 1
          fi
          echo "trusted base: $BASE"
          # No tolerance and no grep: the gate either closes or the build fails.
          python3 scripts/implementation_contract_closure.py validate \
            --record examples/implementation-contract-closure.json \
            --inventory examples/implementation-contract-closure.inventory.txt \
            --integration-ref origin/main \
            --trusted-base "$BASE"
      - name: Contract closure gates a different project from the built package
        run: python3 .github/scripts/contract_closure_package_e2e.py
      - name: Release package ships every consumer
        run: python3 scripts/package_skills.py
      - name: Task artifact gate (self-controls)
        run: python3 scripts/task_artifacts.py selftest
      - name: Task artifact acceptance cases
        run: python3 scripts/task_artifacts.py cases --cases fixtures/task-artifacts/cases.jsonl
