name: deploy-lp

on:
  push:
    branches: [main]
    paths:
      - "lp/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-lp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy lp to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: deploy
